name: Publish npm package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # A manual dispatch may retry an unpublished version. Pushes publish only a
    # version that changed in package.json; this workflow never creates commits.
    if: github.event_name == 'workflow_dispatch' || github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check whether package version changed
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous="$(git show "$BEFORE:package.json" 2>/dev/null || true)"
          if previous="$previous" node -e '
              const previous = process.env.previous;
              const current = JSON.parse(require("fs").readFileSync("package.json", "utf8"));
              if (!previous) process.exit(10);
              process.exit(JSON.parse(previous).version === current.version ? 0 : 10);
            '; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -eq 10 ]; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
            else
              exit "$status"
            fi
          fi
      - name: Stop when the package version did not change
        if: steps.version.outputs.changed != 'true'
        run: echo 'package.json version is unchanged; nothing to publish.'
      - name: Install, test, build, and inspect package
        if: steps.version.outputs.changed == 'true'
        run: |
          bun install --frozen-lockfile
          bun run format:check
          bun run lint
          bun run typecheck
          bun test
          bun run build
          bun scripts/verify-package.ts
      - name: Check npm CLI requirement
        if: steps.version.outputs.changed == 'true'
        run: |
          node --version
          NPM_VERSION="$(npm --version)"
          printf 'npm %s\n' "$NPM_VERSION"
          NPM_VERSION="$NPM_VERSION" node -e '
            const [major, minor, patch] = process.env.NPM_VERSION.split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              throw new Error(`npm ${process.env.NPM_VERSION} is below 11.5.1, required for trusted publishing`);
            }
          '
      - name: Check npm registry for this exact version
        if: steps.version.outputs.changed == 'true'
        id: registry
        run: |
          set +e
          result="$(npm view "$(node -p 'require("./package.json").name + "@" + require("./package.json").version')" version --json 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'This exact npm version already exists; nothing to publish.'
          elif printf '%s' "$result" | grep -q 'E404'; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$result" >&2
            exit "$status"
          fi
      - name: Publish with npm trusted publishing
        if: steps.version.outputs.changed == 'true' && steps.registry.outputs.publish == 'true'
        run: npm publish --access public
